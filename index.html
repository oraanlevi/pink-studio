<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink — Digital Product Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>

    /* ── Lobby ── */
    .lobby {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Background image layer */
    .lobby-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }
    .lobby-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 600ms ease;
    }
    .lobby-bg-img.visible { opacity: 0.12; }

    /* Inner */
    .lobby-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1400px;
      padding: 40px 72px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Hero text */
    .lobby-name {
      display: block;
      font-family: "Oswald", "Bebas Neue", "Impact", sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 16px;
      padding-top: 4px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 700ms ease, transform 700ms ease;
    }
    .lobby-position {
      display: block;
      font-family: "Oswald", "Bebas Neue", "Impact", sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 700ms ease, transform 700ms ease;
    }
    .lobby-tagline {
      display: block;
      font-family: "Bebas Neue", "Impact", sans-serif;
      font-weight: 400;
      font-size: clamp(22px, 2.4vw, 34px);
      color: var(--ink-2);
      line-height: 1.3;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 700ms ease, transform 700ms ease;
    }
    .lobby-name.in,
    .lobby-position.in,
    .lobby-tagline.in { opacity: 1; transform: none; }

    /* Labels */
    .lobby-labels {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .lobby-label {
      display: block;
      width: fit-content;
      font-family: "Bebas Neue", "Impact", sans-serif;
      font-weight: 400;
      font-size: clamp(52px, 7vw, 100px);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ink);
      text-decoration: none;
      line-height: 1.0;
      opacity: 0;
      will-change: transform;
    }

    /* Per-label resting position + arrival from below */
    .lobby-label[data-key="services"] {
      margin-left: 10%;
      transform: rotate(-0.6deg) translateY(18px);
      transition: opacity 1000ms cubic-bezier(.16,1,.3,1),
                  transform 1000ms cubic-bezier(.16,1,.3,1),
                  color 260ms ease;
    }
    .lobby-label[data-key="products"] {
      margin-left: 27%;
      margin-top: 48px;
      transform: rotate(0.9deg) translateY(18px);
      transition: opacity 1000ms cubic-bezier(.16,1,.3,1),
                  transform 1000ms cubic-bezier(.16,1,.3,1),
                  color 260ms ease;
    }
    .lobby-label[data-key="work"] {
      margin-left: 6%;
      transform: rotate(-1.1deg) translateY(18px);
      transition: opacity 1000ms cubic-bezier(.16,1,.3,1),
                  transform 1000ms cubic-bezier(.16,1,.3,1),
                  color 260ms ease;
    }
    .lobby-label[data-key="forma"] {
      margin-left: 36%;
      transform: rotate(0.4deg) translateY(18px);
      transition: opacity 1000ms cubic-bezier(.16,1,.3,1),
                  transform 1000ms cubic-bezier(.16,1,.3,1),
                  color 260ms ease;
    }

    /* Arrived — settled on the table */
    .lobby-label[data-key="services"].arrived { opacity: 1; transform: rotate(-0.6deg); }
    .lobby-label[data-key="products"].arrived { opacity: 1; transform: rotate(0.9deg);  }
    .lobby-label[data-key="work"].arrived     { opacity: 1; transform: rotate(-1.1deg); }
    .lobby-label[data-key="forma"].arrived    { opacity: 1; transform: rotate(0.4deg);  }

    /* Settled — smooth snap back on un-hover */
    .lobby-label.settled {
      transition: transform 500ms ease, color 260ms ease;
    }

    /* Drift keyframes */
    @keyframes drift-services {
      0%   { transform: rotate(-0.6deg) translate(0,    0);   }
      30%  { transform: rotate(-0.2deg) translate(7px, -5px); }
      65%  { transform: rotate(-0.9deg) translate(-4px,-8px); }
      100% { transform: rotate(-0.6deg) translate(0,    0);   }
    }
    @keyframes drift-products {
      0%   { transform: rotate(0.9deg)  translate(0,    0);   }
      35%  { transform: rotate(1.3deg)  translate(-6px,-6px); }
      70%  { transform: rotate(0.5deg)  translate(7px, -4px); }
      100% { transform: rotate(0.9deg)  translate(0,    0);   }
    }
    @keyframes drift-work {
      0%   { transform: rotate(-1.1deg) translate(0,    0);   }
      40%  { transform: rotate(-0.6deg) translate(5px, -7px); }
      75%  { transform: rotate(-1.4deg) translate(-3px,-3px); }
      100% { transform: rotate(-1.1deg) translate(0,    0);   }
    }
    @keyframes drift-forma {
      0%   { transform: rotate(0.4deg)  translate(0,    0);   }
      45%  { transform: rotate(0.8deg)  translate(-7px,-5px); }
      80%  { transform: rotate(0.1deg)  translate(4px, -8px); }
      100% { transform: rotate(0.4deg)  translate(0,    0);   }
    }

    /* Hover drift — only once settled */
    .lobby-label[data-key="services"].settled:hover { animation: drift-services 6s   ease-in-out infinite; }
    .lobby-label[data-key="products"].settled:hover { animation: drift-products 7s   ease-in-out infinite; }
    .lobby-label[data-key="work"].settled:hover     { animation: drift-work     5.5s ease-in-out infinite; }
    .lobby-label[data-key="forma"].settled:hover    { animation: drift-forma    6.5s ease-in-out infinite; }

    /* Siblings dim when one is hovered */
    .lobby-labels:has(.lobby-label:hover) .lobby-label:not(:hover) {
      color: var(--ink-3);
    }

    /* ── Mobile ── */
    @media (max-width: 860px) {
      .lobby-inner { padding: 48px 24px; gap: 36px; }

      .lobby-label[data-key="services"] { margin-left: 0;  transform: rotate(-0.3deg) translateY(14px); }
      .lobby-label[data-key="products"] { margin-left: 5%; transform: rotate(0.3deg)  translateY(14px); }
      .lobby-label[data-key="work"]     { margin-left: 0;  transform: rotate(-0.2deg) translateY(14px); }
      .lobby-label[data-key="forma"]    { margin-left: 4%; transform: rotate(0.2deg)  translateY(14px); }

      .lobby-label[data-key="services"].arrived { transform: rotate(-0.3deg); }
      .lobby-label[data-key="products"].arrived { transform: rotate(0.3deg);  }
      .lobby-label[data-key="work"].arrived     { transform: rotate(-0.2deg); }
      .lobby-label[data-key="forma"].arrived    { transform: rotate(0.2deg);  }

      .lobby-label.settled:hover { animation: none !important; }
      .lobby-labels:has(.lobby-label:hover) .lobby-label:not(:hover) { color: var(--ink); }
      .lobby-bg-img { display: none; }
    }

  </style>
</head>
<body>

  <nav class="nav" id="mainNav">
    <div class="nav-links">
      <a href="/work/">Work</a>
      <a href="/services/">Services</a>
      <a href="/products/">Products</a>
      <a href="/studio/">Studio</a>
    </div>
    <a class="nav-brand" href="/">Pink</a>
    <div class="nav-end"><a href="/contact/">Start a Project</a></div>
    <button class="nav-ham" id="navHam" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="mobile-nav" id="mobileNav" aria-hidden="true">
    <a href="/work/">Work</a>
    <a href="/services/">Services</a>
    <a href="/products/">Products</a>
    <a href="/studio/">Studio</a>
    <a href="/contact/">Start a Project</a>
  </div>

  <!-- Editorial background images — revealed on hover -->
  <div class="lobby-bg" aria-hidden="true">
    <img class="lobby-bg-img" data-key="services" src="/assets/office.png"         alt="" />
    <img class="lobby-bg-img" data-key="products" src="/assets/mag.png"            alt="" />
    <img class="lobby-bg-img" data-key="work"     src="/assets/fashionoutside.png" alt="" />
    <img class="lobby-bg-img" data-key="forma"    src="/assets/dashboardforma.png" alt="" />
  </div>

  <main class="lobby">
    <div class="lobby-inner">

      <div class="lobby-hero">
        <span class="lobby-name">Pink</span>
        <span class="lobby-position">Digital Product Studio</span>
        <span class="lobby-tagline">Websites. Software. Products.</span>
      </div>

      <nav class="lobby-labels" aria-label="Studio paths">
        <a class="lobby-label" data-key="services" href="/services/">Services</a>
        <a class="lobby-label" data-key="products" href="/products/">Products</a>
        <a class="lobby-label" data-key="work"     href="/work/">Work</a>
        <a class="lobby-label" data-key="forma"    href="https://forma-rho-nine.vercel.app" target="_blank" rel="noopener">FORMA</a>
      </nav>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-brand-wrap">
      <span class="footer-brand">Pink Web Studio</span>
      <span class="footer-brand-sub">Los Angeles &middot; Currently Booking</span>
    </div>
    <div class="footer-social">
      <div class="footer-social-icons">
        <a href="https://instagram.com/oraanlevi" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".5" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/oraan-levi-898a89200/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
      </div>
      <a href="mailto:studio@pinkwebstudio.com" class="footer-email">studio@pinkwebstudio.com</a>
    </div>
  </footer>

  <script>
    /* ── Nav ── */
    const nav = document.getElementById('mainNav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });

    const ham  = document.getElementById('navHam');
    const mob  = document.getElementById('mobileNav');
    ham.addEventListener('click', () => {
      const open = ham.classList.toggle('open');
      mob.classList.toggle('open', open);
      ham.setAttribute('aria-expanded', open);
      mob.setAttribute('aria-hidden', !open);
    });
    mob.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      ham.classList.remove('open');
      mob.classList.remove('open');
    }));

    /* ── Hero entrance (staggered fade-in) ── */
    const heroItems = [
      document.querySelector('.lobby-name'),
      document.querySelector('.lobby-position'),
      document.querySelector('.lobby-tagline'),
    ];
    heroItems.forEach((el, i) => {
      setTimeout(() => el.classList.add('in'), 160 + i * 190);
    });

    /* ── Label entrance (settle onto the table) ── */
    const labels = document.querySelectorAll('.lobby-label');
    labels.forEach((label, i) => {
      setTimeout(() => {
        label.classList.add('arrived');
        /* Mark settled after arrival transition completes */
        setTimeout(() => label.classList.add('settled'), 1000);
      }, 980 + i * 240);
    });

    /* ── Hover: reveal background image ── */
    const bgImgs    = document.querySelectorAll('.lobby-bg-img');
    const hasHover  = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    if (hasHover) {
      labels.forEach(label => {
        label.addEventListener('mouseenter', () => {
          const key = label.dataset.key;
          bgImgs.forEach(img => img.classList.toggle('visible', img.dataset.key === key));
        });
        label.addEventListener('mouseleave', () => {
          bgImgs.forEach(img => img.classList.remove('visible'));
        });
      });
    }
  </script>

</body>
</html>
